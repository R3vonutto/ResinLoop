name: astrbot_plugin_resinloop
display_name: ResinLoop 日常巡查
short_desc: 米游社 / 森空岛的每日任务没做完？到点提醒你（只查询，不签到）
desc: |
  移植自 ResinLoop 的 AstrBot 插件。

  支持原神、崩坏：星穹铁道、绝区零（米游社）与明日方舟、终末地（森空岛）。
  到点巡检每日委托等判定项，没做完就推一条；支持体力溢出与活动结束提醒。

  多人独立：账号、历史、提醒按「平台 + 发送者」隔离，群里各查各的，提醒默认发私聊。

  只读：不签到、不领奖励、不改任何游戏数据。
version: v1.1.1
author: R3vonutto
repo: https://github.com/R3vonutto/ResinLoop
astrbot_version: ">=4.16,<5"
